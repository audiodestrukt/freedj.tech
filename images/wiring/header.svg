<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">
<rect width="900" height="630" fill="#fff"/>
<text x="20" y="24" font-size="15" font-weight="bold">ESP32-P4 dev kit, 40-pin header (front view, header on the left edge)</text>
