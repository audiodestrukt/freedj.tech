<text x="394" y="442" text-anchor="end" fill="#888">RXD·38</text>
<circle cx="470" cy="438" r="7" fill="#222" stroke="#fff" stroke-width="1.5"/>
<text x="490" y="442" fill="#999">9</text>
<text x="516" y="442" fill="#000">GND</text>
<text x="588" y="442" font-weight="bold" fill="#222">jog DIR</text>
