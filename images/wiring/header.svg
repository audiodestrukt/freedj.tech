<text x="394" y="130" text-anchor="end" fill="#888">GND</text>
<circle cx="470" cy="126" r="7" fill="#bbb" stroke="#fff" stroke-width="1.5"/>
<text x="490" y="130" fill="#999">33</text>
<text x="516" y="130" fill="#888">GPIO48</text>
