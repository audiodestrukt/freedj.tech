<text x="394" y="260" text-anchor="end" fill="#888">GPIO36</text>
<circle cx="470" cy="256" r="7" fill="#bbb" stroke="#fff" stroke-width="1.5"/>
<text x="490" y="260" fill="#999">23</text>
<text x="516" y="260" fill="#888">GPIO0</text>
<circle cx="440" cy="230" r="7" fill="#bbb" stroke="#fff" stroke-width="1.5"/>
<text x="420" y="234" text-anchor="end" fill="#999">26</text>
<text x="394" y="234" text-anchor="end" fill="#888">GPIO32</text>
<circle cx="470" cy="230" r="7" fill="#222" stroke="#fff" stroke-width="1.5"/>
<text x="490" y="234" fill="#999">25</text>
<text x="516" y="234" fill="#000">GND</text>
<text x="588" y="234" font-weight="bold" fill="#222">panel CUE: diagonal leg</text>
<circle cx="440" cy="204" r="7" fill="#27ae60" stroke="#fff" stroke-width="1.5"/>
