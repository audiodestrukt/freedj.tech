<text x="394" y="208" text-anchor="end" fill="#000">GPIO25</text>
<text x="322" y="208" text-anchor="end" font-weight="bold" fill="#27ae60">panel PLAY: one leg</text>
<circle cx="470" cy="204" r="7" fill="#e67e22" stroke="#fff" stroke-width="1.5"/>
<text x="490" y="208" fill="#999">27</text>
<text x="516" y="208" fill="#000">GPIO24</text>
