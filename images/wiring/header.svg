<text x="394" y="338" text-anchor="end" fill="#000">GPIO4</text>
<text x="322" y="338" text-anchor="end" font-weight="bold" fill="#8e44ad">screen RESET</text>
<circle cx="470" cy="334" r="7" fill="#d22" stroke="#fff" stroke-width="1.5"/>
