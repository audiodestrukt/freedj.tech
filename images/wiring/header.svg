<circle cx="440" cy="542" r="7" fill="#bbb" stroke="#fff" stroke-width="1.5"/>
<text x="420" y="546" text-anchor="end" fill="#999">2</text>
<text x="394" y="546" text-anchor="end" fill="#888">5V</text>
<circle cx="470" cy="542" r="7" fill="#d22" stroke="#fff" stroke-width="1.5"/>
<text x="490" y="546" fill="#999">1</text>
<text x="516" y="546" fill="#000">3V3</text>
<text x="588" y="546" font-weight="bold" fill="#d22">jog VCC, panel pitch: screen end</text>
<circle cx="440" cy="516" r="7" fill="#bbb" stroke="#fff" stroke-width="1.5"/>
