<circle cx="440" cy="178" r="7" fill="#222" stroke="#fff" stroke-width="1.5"/>
<text x="420" y="182" text-anchor="end" fill="#999">30</text>
<text x="394" y="182" text-anchor="end" fill="#000">GND</text>
<text x="322" y="182" text-anchor="end" font-weight="bold" fill="#222">panel PLAY: diagonal leg</text>
<circle cx="470" cy="178" r="7" fill="#bbb" stroke="#fff" stroke-width="1.5"/>
<text x="490" y="182" fill="#999">29</text>
<text x="516" y="182" fill="#888">GPIO33</text>
<circle cx="440" cy="152" r="7" fill="#bbb" stroke="#fff" stroke-width="1.5"/>
<text x="420" y="156" text-anchor="end" fill="#999">32</text>
<text x="394" y="156" text-anchor="end" fill="#888">GPIO54</text>
<circle cx="470" cy="152" r="7" fill="#bbb" stroke="#fff" stroke-width="1.5"/>
