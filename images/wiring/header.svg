<text x="420" y="104" text-anchor="end" fill="#999">36</text>
<text x="394" y="104" text-anchor="end" fill="#888">GPIO46</text>
<circle cx="470" cy="100" r="7" fill="#bbb" stroke="#fff" stroke-width="1.5"/>
<text x="490" y="104" fill="#999">35</text>
<text x="516" y="104" fill="#888">GPIO53</text>
<circle cx="440" cy="74" r="7" fill="#bbb" stroke="#fff" stroke-width="1.5"/>
<text x="420" y="78" text-anchor="end" fill="#999">38</text>
<text x="394" y="78" text-anchor="end" fill="#888">GPIO27</text>
<circle cx="470" cy="74" r="7" fill="#bbb" stroke="#fff" stroke-width="1.5"/>
<text x="490" y="78" fill="#999">37</text>
<text x="516" y="78" fill="#888">GPIO47</text>
<circle cx="440" cy="48" r="7" fill="#bbb" stroke="#fff" stroke-width="1.5"/>
<text x="420" y="52" text-anchor="end" fill="#999">40</text>
<text x="394" y="52" text-anchor="end" fill="#888">GPIO45</text>
<circle cx="470" cy="48" r="7" fill="#555" stroke="#fff" stroke-width="1.5"/>
<text x="490" y="52" fill="#999">39</text>
<text x="516" y="52" fill="#888">GND</text>
<text x="20" y="574" fill="#555">pin 1 (3V3) is at the end near the C6_UART connector and the USB-C ports;</text>
<text x="20" y="592" fill="#555">the two 5V pins are on the board edge. Grey pins are unused. Never connect anything to 5V.</text>
<text x="20" y="610" fill="#555">GND is also on pins 34 and 39 if you run out.</text>
